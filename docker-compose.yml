services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pipeline
      # Bootstrap superuser: used only by the image entrypoint to run docker/initdb.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Loopback only: the passwords here are defaults, so the server is not exposed to the network.
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the init-time server listens on the socket only, so this
      # stays unhealthy until docker/initdb has run and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pipeline"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
